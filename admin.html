<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads | Fussballcamp Antalya</title>
<style>
body{margin:0;background:#f4f7f2;color:#18251d;font:15px system-ui,sans-serif}.shell{max-width:1180px;margin:0 auto;padding:40px 20px}h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.muted{color:#607064}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}input,button,select{font:inherit;padding:11px 13px;border:1px solid #cbd6cc;border-radius:8px}button{background:#e16f35;color:#fff;border:0;cursor:pointer;font-weight:700}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:13px;border-bottom:1px solid #e8eee8;vertical-align:top}th{background:#163b2a;color:#fff}.error{color:#b42318}.empty{padding:24px;text-align:center}@media(max-width:720px){table{font-size:12px}th,td{padding:8px}}
</style></head>
<body><main class="shell"><p class="muted">FUSSBALLCAMP ANTALYA · INTERNAL</p><h1>Lead dashboard</h1><p class="muted">Enquiries from players, parents and group organisers.</p><div class="bar"><input id="key" type="password" placeholder="Admin API key" autocomplete="off"><button id="load">Load leads</button></div><p id="error" class="error" role="alert"></p><table><thead><tr><th>Date</th><th>Contact</th><th>Trip</th><th>Details</th><th>Status</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="5">Enter your key to load leads.</td></tr></tbody></table></main>
<script>
const key=document.querySelector('#key'),rows=document.querySelector('#rows'),error=document.querySelector('#error');const esc=(value)=>String(value??'-').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
async function load(){error.textContent='';const response=await fetch('/api/admin/leads',{headers:{'x-admin-key':key.value}});const data=await response.json();if(!response.ok){error.textContent=data.error||'Unable to load leads';return}rows.innerHTML=data.length?data.map((lead)=>`<tr><td>${esc(new Date(lead.created_at).toLocaleString())}</td><td><strong>${esc(lead.name)}</strong><br><a href="mailto:${esc(lead.email)}">${esc(lead.email)}</a><br>${esc(lead.phone)}</td><td>${esc(lead.trip_type)}<br>${esc(lead.travel_month)}</td><td>Age: ${esc(lead.player_age)}<br>Group: ${esc(lead.group_size)}<br>${esc(lead.message)}</td><td><select data-id="${lead.id}">${['new','contacted','qualified','closed'].map((status)=>`<option ${status===lead.status?'selected':''}>${status}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td class="empty" colspan="5">No leads yet.</td></tr>';rows.querySelectorAll('select').forEach((select)=>select.addEventListener('change',async()=>{await fetch('/api/admin/leads/'+select.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key.value},body:JSON.stringify({status:select.value})})}))}document.querySelector('#load').addEventListener('click',load);key.addEventListener('keydown',(event)=>{if(event.key==='Enter')load()});
</script></body></html>
