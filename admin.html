<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads | Fussballcamp Antalya</title>
<style>
:root{--ink:#18251d;--muted:#607064;--line:#e1eae1;--green:#163b2a;--orange:#e16f35;--bg:#f4f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{max-width:1280px;margin:0 auto;padding:32px 20px 56px}h1{font-size:clamp(30px,5vw,52px);margin:0}.muted{color:var(--muted)}.bar,.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0}input,button,select{font:inherit;padding:10px 12px;border:1px solid #cbd6cc;border-radius:8px;background:#fff}button{background:var(--orange);color:#fff;border:0;cursor:pointer;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr))}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.stat strong{display:block;font-size:26px;color:var(--green)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--green);color:#fff}.error{color:#b42318}.success{color:#18733d}.empty{text-align:center;padding:30px}@media(max-width:600px){.shell{padding:24px 14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style></head>
<body><main class="shell"><p class="muted">FUSSBALLCAMP ANTALYA · INTERNAL</p><h1>Lead dashboard</h1><p class="muted">Review, filter and follow up on player, parent and group enquiries.</p><div class="bar"><input id="key" type="password" placeholder="Admin API key" autocomplete="off"><input id="search" placeholder="Search name or email" disabled><select id="statusFilter" disabled><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>closed</option></select><button id="load">Load leads</button><button id="refresh" type="button" disabled>Refresh</button></div><p id="message" class="muted" role="status"></p><div class="stats"><div class="stat"><span class="muted">Total</span><strong id="total">—</strong></div><div class="stat"><span class="muted">New</span><strong id="newCount">—</strong></div><div class="stat"><span class="muted">In progress/closed</span><strong id="doneCount">—</strong></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Contact</th><th>Trip</th><th>Details</th><th>Status</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="5">Enter your key and load leads.</td></tr></tbody></table></div></main>
<script>
const key=document.querySelector('#key'),search=document.querySelector('#search'),filter=document.querySelector('#statusFilter'),rows=document.querySelector('#rows'),message=document.querySelector('#message'),total=document.querySelector('#total'),newCount=document.querySelector('#newCount'),doneCount=document.querySelector('#doneCount'),refresh=document.querySelector('#refresh');let leads=[];
const esc=(value)=>String(value??'-').replace(/[&<>"']/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function render(){const query=search.value.trim().toLowerCase(),status=filter.value;const visible=leads.filter((lead)=>{const hay=[lead.name,lead.email,lead.phone].join(' ').toLowerCase();return(!query||hay.includes(query))&&(!status||lead.status===status)});rows.innerHTML=visible.length?visible.map((lead)=>`<tr><td>${esc(new Date(lead.created_at).toLocaleString())}</td><td><strong>${esc(lead.name)}</strong><br><a href="mailto:${esc(lead.email)}">${esc(lead.email)}</a><br>${esc(lead.phone)}</td><td>${esc(lead.trip_type)}<br>${esc(lead.travel_month)}</td><td>Age: ${esc(lead.player_age)}<br>Group: ${esc(lead.group_size)}<br>${esc(lead.message)}</td><td><select data-id="${lead.id}">${['new','contacted','qualified','closed'].map((status)=>`<option ${status===lead.status?'selected':''}>${status}</option>`).join('')}</select></td></tr>`).join(''):'<tr><td class="empty" colspan="5">No matching leads.</td></tr>';rows.querySelectorAll('select').forEach((select)=>select.addEventListener('change',()=>updateStatus(select)));}
function updateStats(){total.textContent=leads.length;newCount.textContent=leads.filter((lead)=>lead.status==='new').length;doneCount.textContent=leads.filter((lead)=>lead.status!=='new').length}
async function load(){message.textContent='Loading…';const response=await fetch('/api/admin/leads',{headers:{'x-admin-key':key.value}});const data=await response.json();if(!response.ok){message.className='error';message.textContent=data.error||'Unable to load leads';return}leads=data;search.disabled=filter.disabled=refresh.disabled=false;updateStats();render();message.className='success';message.textContent=`Loaded ${data.length} leads.`}
async function updateStatus(select){const response=await fetch('/api/admin/leads/'+encodeURIComponent(select.dataset.id),{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key.value},body:JSON.stringify({status:select.value})});if(!response.ok){message.className='error';message.textContent='Unable to update lead status.';return}const lead=leads.find((entry)=>String(entry.id)===select.dataset.id);if(lead)lead.status=select.value;updateStats();message.className='success';message.textContent='Status updated.'}
document.querySelector('#load').addEventListener('click',load);refresh.addEventListener('click',load);search.addEventListener('input',render);filter.addEventListener('change',render);key.addEventListener('keydown',(event)=>{if(event.key==='Enter')load()});
</script></body></html>
